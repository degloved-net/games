<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>ExportedProject</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #unity-canvas { display: block; width: 100% !important; height: 100% !important; }
  </style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="unity-loading-bar">
  <div id="unity-logo"></div>
  <div id="unity-progress-bar-empty">
    <div id="unity-progress-bar-full"></div>
  </div>
</div>
<script>
  var canvas = document.querySelector("#unity-canvas");

  function unityShowBanner(msg, type) {
    if (type === 'error') console.error(msg);
    else console.warn(msg);
  }

  var buildUrl = "Build";
  var config = {
    arguments: [],
    dataUrl: buildUrl + "/port.data",
    frameworkUrl: buildUrl + "/port.framework.js",
    codeUrl: buildUrl + "/port.wasm",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "DefaultCompany",
    productName: "ExportedProject",
    productVersion: "1.0",
    showBanner: unityShowBanner,
  };

  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
    var meta = document.createElement('meta');
    meta.name = 'viewport';
    meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
    document.getElementsByTagName('head')[0].appendChild(meta);
  }

  document.querySelector("#unity-loading-bar").style.display = "block";

  function fetchParts(prefix, count) {
    var promises = [];
    for (var i = 0; i < count; i++) {
      var part = prefix + ".part." + String(i).padStart(2, "0");
      promises.push(fetch(part).then(function(r) { return r.arrayBuffer(); }));
    }
    return Promise.all(promises).then(function(buffers) {
      return new Blob(buffers);
    });
  }

  Promise.all([
    fetchParts(buildUrl + "/port.data", 6),
    fetchParts(buildUrl + "/port.wasm", 2)
  ]).then(function(blobs) {
    config.dataUrl = URL.createObjectURL(blobs[0]);
    config.codeUrl = URL.createObjectURL(blobs[1]);

    var script = document.createElement("script");
    script.src = buildUrl + "/port.loader.js";
    script.onload = function() {
      createUnityInstance(canvas, config, function(progress) {
        document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
      }).then(function() {
        document.querySelector("#unity-loading-bar").style.display = "none";
        URL.revokeObjectURL(config.dataUrl);
        URL.revokeObjectURL(config.codeUrl);
      }).catch(function(message) {
        console.error(message);
      });
    };
    document.body.appendChild(script);
  });
</script>
</body>
</html>
