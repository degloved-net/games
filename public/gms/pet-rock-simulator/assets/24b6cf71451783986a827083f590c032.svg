<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="401.03941" height="282.91836" viewBox="0,0,401.03941,282.91836"><defs><linearGradient x1="240.00002" y1="46.79067" x2="240.00002" y2="111.05618" gradientUnits="userSpaceOnUse" id="color-1"><stop offset="0" stop-color="#ea5a00"/><stop offset="1" stop-color="#ff7c2b"/></linearGradient></defs><g transform="translate(-44.15831,-34.04108)"><g stroke-miterlimit="10"><path d="M47.90831,252.70797c0,-50.58918 0,-118.93037 0,-147.53866c0,-25.44182 31.6869,-58.3786 59.44003,-58.3786c44.53989,0 181.0096,0 262.17301,0c37.04642,0 62.57035,32.23675 62.57035,57.31718c0,29.01157 0,99.57648 0,150.72295c0,33.30662 -34.28555,58.3786 -63.63178,58.3786c-44.00902,0 -172.3127,0 -252.62015,0c-39.88532,0 -67.93146,-26.16075 -67.93146,-60.50146z" fill="#9a5830" stroke="#744224" stroke-width="7.5" stroke-linecap="butt" stroke-linejoin="miter"/><path d="M47.90831,105.16927c0,-25.44182 31.6869,-58.3786 59.44003,-58.3786c44.53989,0 181.0096,0 262.17301,0c37.04642,0 62.57035,32.23675 62.57035,57.31718c0,8.7575 -33.20423,6.08187 -80.64323,5.72427c-31.56249,-0.23792 -188.58052,0.92629 -224.00271,1.02266c-42.67497,0.11609 -79.53745,1.60541 -79.53745,-5.6855z" fill="url(#color-1)" stroke="#744224" stroke-width="7.5" stroke-linecap="butt" stroke-linejoin="miter"/><text transform="translate(142.2465,93.03844) scale(0.86892,0.86892)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" font-family="Pixel" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Update log</tspan></text><text transform="translate(59.2166,129.56419) scale(0.30825,0.3245)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" font-family="Pixel" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">                                             Version 1.4.1</tspan><tspan x="0" dy="46.150000000000006px">Hello there! I have worked very hard the last previous</tspan><tspan x="0" dy="46.150000000000006px">months on pet rock simulator and i am ready to say that</tspan><tspan x="0" dy="46.150000000000006px">its finally done,  i will probably not add any new things to</tspan><tspan x="0" dy="46.150000000000006px">the game, the game and events will still be playable.</tspan><tspan x="0" dy="46.150000000000006px">If you have questions about the game you can ask them</tspan><tspan x="0" dy="46.150000000000006px">in the comment section or on my profile.</tspan><tspan x="0" dy="46.150000000000006px">I am done with pet rock simulator 1, but i have been</tspan><tspan x="0" dy="46.150000000000006px">working on a sequel for the past weeks in 2025. I expect</tspan><tspan x="0" dy="46.150000000000006px">to finish it in a few months maybe, keep an eye out on my</tspan><tspan x="0" dy="46.150000000000006px">itch.io profile!</tspan></text><g><path d="M441.44772,62.25003c0,13.50831 -10.94561,24.45895 -24.44771,24.45895c-13.5021,0 -24.44771,-10.95065 -24.44771,-24.45895c0,-13.50831 10.94562,-24.45895 24.44771,-24.45895c13.5021,0 24.44771,10.95065 24.44771,24.45895z" fill="#9a5830" stroke="#744224" stroke-width="7.5" stroke-linecap="butt" stroke-linejoin="miter"/><text transform="translate(406.41934,71.56942) scale(0.88644,0.69075)" font-size="40" xml:space="preserve" fill="#ff0000" stroke="#ff0000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">X</tspan></text></g></g></g></svg>