<!DOCTYPE html>
<html>
<head>
    <link href="style.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; }
        html, body { overflow: hidden; width: 100%; height: 100%; }
    </style>
</head>
<body dir="ltr">
<script src="UnityProgress.js"></script>
<script src="UnityLoader.js"></script>

<div class="webgl-content">
    <div id="gameContainer" style="width: 100vw; height: 100vh"></div>
    <div id="loading-text" style="position: absolute; top: 50px; left: 50%; transform: translateX(-50%); color: white; font-size: 48px; font-family: cursive; text-align: center;">
        LOADING...
    </div>
</div>

<script>
    var gameInstance = UnityLoader.instantiate("gameContainer", "totm.json", {
        onProgress: function(gameInstance, progress) {
            if (typeof UnityProgress === 'function') {
                UnityProgress(gameInstance, progress);
            }

            var loadingText = document.getElementById("loading-text");
            if (loadingText) {
                if (progress === "complete" || progress >= 1) {
                    loadingText.style.display = "none";
                } else {
                    loadingText.textContent = "LOADING... " + Math.round(progress * 100) + "%";
                }
            }
        },
        Module: {
            onRuntimeInitialized: function() {
                var loadingText = document.getElementById("loading-text");
                if (loadingText) {
                    loadingText.style.display = "none";
                }

                if (typeof UnityProgress === 'function') {
                    UnityProgress(gameInstance, "complete");
                }
            }
        }
    });
</script>
</body>
</html>
