<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Celeste</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #231F20; display: flex; align-items: center; justify-content: center; }
    #unity-canvas {
      display: block;
      aspect-ratio: 1280 / 720;
      width: min(100vw, 100vh * (1280/720)) !important;
      height: min(100vh, 100vw * (720/1280)) !important;
    }
  </style>
</head>
<body>
<canvas id="unity-canvas" width="1280" height="720"></canvas>
<script src="Build/build.loader.js"></script>
<script>
  createUnityInstance(document.querySelector("#unity-canvas"), {
    dataUrl: "Build/build.data",
    frameworkUrl: "Build/build.framework.js",
    codeUrl: "Build/build.wasm",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "DefaultCompany",
    productName: "Celeste",
    productVersion: "0.1",
  });
</script>
</body>
</html>
